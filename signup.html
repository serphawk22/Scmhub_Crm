<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Account Creation — SCM HUB CRM</title>
  <meta name="description" content="Account creation is managed by your organization administrator.">
  <link rel="stylesheet" href="styles.css">
</head>
<body class="auth-page">

  <!-- Subtle ambient background grid animation -->
  <div class="bg-ambient-grid" aria-hidden="true"></div>

  <!-- Header -->
  <header class="auth-header">
    <a href="index.html" class="nav-brand" aria-label="SCM HUB CRM Home">
      <div class="brand-mark">S</div>
      <span>SCM HUB CRM</span>
      <span class="brand-sub">SERP Hawk</span>
    </a>

    <!-- Theme Toggle Button -->
    <button type="button" class="icon-btn" data-theme-toggle aria-label="Switch theme">
      <svg class="icon-sun" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="display:none;">
        <circle cx="12" cy="12" r="4"></circle>
        <path d="M12 2v2"></path>
        <path d="M12 20v2"></path>
        <path d="m4.93 4.93 1.41 1.41"></path>
        <path d="m17.66 17.66 1.41 1.41"></path>
        <path d="M2 12h2"></path>
        <path d="M20 12h2"></path>
        <path d="m6.34 17.66-1.41 1.41"></path>
        <path d="m19.07 4.93-1.41 1.41"></path>
      </svg>
      <svg class="icon-moon" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <path d="M12 3a6 6 0 0 0 9 9 9 9 0 1 1-9-9Z"></path>
      </svg>
    </button>
  </header>

  <!-- Centered Guard Card -->
  <main class="auth-main">
    <div class="auth-card" style="text-align: center;">
      <div class="guard-icon-box">
        <svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <rect width="18" height="11" x="3" y="11" rx="2" ry="2"></rect>
          <path d="M7 11V7a5 5 0 0 1 10 0v4"></path>
        </svg>
      </div>

      <h1 class="auth-title" style="font-size: 1.35rem; margin-bottom: 12px;">Organization Access</h1>
      <p class="auth-subtitle" style="margin-bottom: 28px; line-height: 1.6;">
        Account creation is managed by your organization administrator.
      </p>

      <a href="signin.html" class="btn btn-primary btn-lg" style="width: 100%;">
        Back to Sign In
      </a>
    </div>
  </main>

  <footer class="auth-footer">
    &copy; 2026 SCM HUB CRM. All rights reserved.
  </footer>

  <script src="script.js"></script>
</body>
</html>
