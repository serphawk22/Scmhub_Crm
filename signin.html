<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sign In — SCM HUB CRM</title>
  <meta name="description" content="Sign in to access your SCM HUB CRM workspace.">
  <link rel="stylesheet" href="styles.css">
</head>
<body class="auth-page">

  <!-- Top bar with Back Link and Theme Toggle -->
  <header class="auth-top-bar">
    <a href="index.html" class="auth-back-home" aria-label="Back to landing page">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <line x1="19" y1="12" x2="5" y2="12"></line>
        <polyline points="12 19 5 12 12 5"></polyline>
      </svg>
      <span>Back to Overview</span>
    </a>

    <!-- Theme Toggle Button -->
    <button type="button" class="icon-btn auth-theme-toggle" data-theme-toggle aria-label="Switch theme">
      <svg class="icon-sun" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor"
        stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="display:none;">
        <circle cx="12" cy="12" r="4"></circle>
        <path d="M12 2v2"></path>
        <path d="M12 20v2"></path>
        <path d="m4.93 4.93 1.41 1.41"></path>
        <path d="m17.66 17.66 1.41 1.41"></path>
        <path d="M2 12h2"></path>
        <path d="M20 12h2"></path>
        <path d="m6.34 17.66-1.41 1.41"></path>
        <path d="m19.07 4.93-1.41 1.41"></path>
      </svg>
      <svg class="icon-moon" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor"
        stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <path d="M12 3a6 6 0 0 0 9 9 9 9 0 1 1-9-9Z"></path>
      </svg>
    </button>
  </header>

  <!-- Auth Main: Centered Login Card & Viewport Wrapper -->
  <main class="auth-main-wrapper">
    <div class="auth-card-container">
      
      <!-- Login Card -->
      <div class="auth-card">
        <!-- Top Branding Inside Card -->
        <div class="auth-brand-header">
          <div class="brand-mark">S</div>
          <div class="auth-brand-title">SCM HUB CRM</div>
          <div class="auth-brand-sub">SERP Hawk</div>
        </div>

        <!-- Headings -->
        <div class="auth-headings">
          <h1 class="auth-title">Welcome back</h1>
          <p class="auth-subtitle">Sign in to access your workspace.</p>
        </div>

        <!-- Sign-in Form (Preserving all IDs and handlers) -->
        <form id="signInForm" class="auth-form" novalidate>
          <!-- Email Field -->
          <div class="form-group">
            <label for="emailInput" class="form-label">Work Email</label>
            <div class="form-input-wrapper">
              <input 
                type="email" 
                id="emailInput" 
                class="form-input" 
                placeholder="user@organization.com" 
                required
                autocomplete="email"
                value="user@organization.com"
              >
            </div>
          </div>

          <!-- Password Field -->
          <div class="form-group">
            <label for="passwordInput" class="form-label">Password</label>
            <div class="form-input-wrapper password-wrapper">
              <input 
                type="password" 
                id="passwordInput" 
                class="form-input" 
                placeholder="••••••••••••" 
                required
                autocomplete="current-password"
                value="••••••••••••"
              >
              <button type="button" class="input-icon-btn" id="togglePassword" aria-label="Toggle password visibility">
                <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                  <path d="M2 12s3-7 10-7 10 7 10 7-3 7-10 7-10-7-10-7Z"></path>
                  <circle cx="12" cy="12" r="3"></circle>
                </svg>
              </button>
            </div>
          </div>

          <!-- Options: Remember me & Forgot Password in one clean row -->
          <div class="form-options-row">
            <label class="checkbox-label" for="rememberMe">
              <input type="checkbox" id="rememberMe" checked>
              <span>Remember me</span>
            </label>
            <a href="#" id="forgotPasswordLink" class="forgot-link">Forgot password?</a>
          </div>

          <!-- Sign In Button -->
          <button type="submit" class="btn btn-primary auth-submit-btn">
            Sign In
          </button>

          <!-- Dynamic inline feedback -->
          <div id="authFeedback" class="auth-feedback-msg" style="display:none;"></div>
        </form>
      </div>

      <!-- Footer Information Below The Card -->
      <footer class="auth-footer-below">
        <p class="auth-admin-note">Account access is managed by your organization administrator.</p>
        <p class="auth-copyright">&copy; 2026 SCM HUB CRM. All rights reserved.</p>
      </footer>

    </div>
  </main>

  <script src="script.js"></script>
</body>
</html>
